services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymtrack_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - gymtrack_net
    depends_on:
      - db
      - redis

  web:
    image: nginx:alpine
    container_name: gymtrack_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gymtrack_net
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: gymtrack_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gymtrack}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - gymtrack_pgsql:/var/lib/postgresql/data
    networks:
      - gymtrack_net

  redis:
    image: redis:7-alpine
    container_name: gymtrack_redis
    restart: unless-stopped
    volumes:
      - gymtrack_redis:/data
    networks:
      - gymtrack_net

networks:
  gymtrack_net:
    driver: bridge

volumes:
  gymtrack_pgsql:
    driver: local
  gymtrack_redis:
    driver: local
