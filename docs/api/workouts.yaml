openapi: 3.0.3
info:
  title: GymTrack — Дневник тренировок (справочник и библиотека платформы)
  version: 1.0.0
paths:
  /api/v1/platform/workouts/exercises:
    get:
      summary: Список системных упражнений платформы
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: muscle_group
          required: false
          schema:
            $ref: '#/components/schemas/MuscleGroup'
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 100
        - in: query
          name: only_active
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Список упражнений платформы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Создание системного упражнения платформы
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveExerciseRequest'
      responses:
        '201':
          description: Упражнение создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/platform/workouts/exercises/{exercise}:
    patch:
      summary: Обновление системного упражнения платформы
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: exercise
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExerciseRequest'
      responses:
        '200':
          description: Упражнение обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/client/workouts/exercises:
    get:
      summary: Список доступных клиенту упражнений (активные платформенные и личные)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: muscle_group
          required: false
          schema:
            $ref: '#/components/schemas/MuscleGroup'
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Список упражнений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Создание личного упражнения клиента
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveExerciseRequest'
      responses:
        '201':
          description: Упражнение создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/client/workouts/exercises/{exercise}:
    patch:
      summary: Обновление личного упражнения клиента
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: exercise
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExerciseRequest'
      responses:
        '200':
          description: Упражнение обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/platform/workouts/plans:
    get:
      summary: Список готовых тренировочных планов платформы
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: level
          required: false
          schema:
            $ref: '#/components/schemas/PlanLevel'
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 100
        - in: query
          name: only_published
          required: false
          schema:
            type: boolean
        - in: query
          name: only_active
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Список планов платформы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutPlanListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Создание готового плана в библиотеке платформы
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreLibraryPlanRequest'
      responses:
        '201':
          description: План создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutPlanItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/platform/workouts/plans/{plan}:
    get:
      summary: Просмотр деталей плана платформы
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: plan
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Детали плана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutPlanItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Обновление готового плана платформы
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: plan
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLibraryPlanRequest'
      responses:
        '200':
          description: План обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutPlanItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/client/workouts/library:
    get:
      summary: Каталог опубликованных тренировочных планов платформы для клиента
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: level
          required: false
          schema:
            $ref: '#/components/schemas/PlanLevel'
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Опубликованные планы библиотеки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutPlanListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/client/workouts/library/{plan}:
    get:
      summary: Детали опубликованного плана из библиотеки платформы
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: plan
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Детали плана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutPlanItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/client/workouts/library/{plan}/copy:
    post:
      summary: Копирование готового плана из библиотеки платформы в собственные планы клиента
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: plan
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyLibraryPlanRequest'
      responses:
        '201':
          description: Личный план создан на основе библиотечного
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutPlanItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/client/workouts/plans:
    get:
      summary: Список активных личных планов тренировок клиента
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список личных планов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutPlanListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Создание собственного тренировочного плана клиента
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveClientPlanRequest'
      responses:
        '201':
          description: Личный план создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutPlanItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/client/workouts/plans/{plan}:
    get:
      summary: Детали личного плана клиента
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: plan
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Детали плана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutPlanItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Обновление собственного плана клиента
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: plan
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveClientPlanRequest'
      responses:
        '200':
          description: План обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutPlanItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      summary: Мягкое архивирование личного плана клиента
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: plan
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: План архивирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    MuscleGroup:
      type: string
      enum: [chest, back, legs, shoulders, arms, core, cardio, full_body]
    PlanLevel:
      type: string
      enum: [beginner, intermediate, advanced]
    Exercise:
      type: object
      required: [id, public_id, is_platform, name, muscle_group, description, is_active]
      properties:
        id:
          type: integer
        public_id:
          type: string
        is_platform:
          type: boolean
        name:
          type: string
        muscle_group:
          $ref: '#/components/schemas/MuscleGroup'
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
    SaveExerciseRequest:
      type: object
      required: [name, muscle_group]
      properties:
        name:
          type: string
          maxLength: 100
        muscle_group:
          $ref: '#/components/schemas/MuscleGroup'
        description:
          type: string
          nullable: true
          maxLength: 1000
    UpdateExerciseRequest:
      allOf:
        - $ref: '#/components/schemas/SaveExerciseRequest'
        - type: object
          properties:
            is_active:
              type: boolean
    ExerciseListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Exercise'
    ExerciseItemResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Exercise'
    PlanItemInput:
      type: object
      required: [exercise_id, target_sets, target_reps]
      properties:
        exercise_id:
          type: integer
          minimum: 1
        sort_order:
          type: integer
          minimum: 0
          nullable: true
        target_sets:
          type: integer
          minimum: 1
          maximum: 20
        target_reps:
          type: integer
          minimum: 1
          maximum: 200
        target_weight_grams:
          type: integer
          minimum: 0
          nullable: true
        rest_seconds:
          type: integer
          minimum: 0
          maximum: 600
          nullable: true
    WorkoutPlanItem:
      type: object
      required: [id, exercise_id, exercise, sort_order, target_sets, target_reps, target_weight_grams, rest_seconds]
      properties:
        id:
          type: integer
        exercise_id:
          type: integer
        exercise:
          type: object
          nullable: true
          required: [id, public_id, name, muscle_group, is_active]
          properties:
            id:
              type: integer
            public_id:
              type: string
            name:
              type: string
            muscle_group:
              $ref: '#/components/schemas/MuscleGroup'
            is_active:
              type: boolean
        sort_order:
          type: integer
        target_sets:
          type: integer
        target_reps:
          type: integer
        target_weight_grams:
          type: integer
          nullable: true
        rest_seconds:
          type: integer
          nullable: true
    WorkoutPlan:
      type: object
      required: [id, public_id, is_platform, source_plan_id, title, description, level, is_published, is_active, items]
      properties:
        id:
          type: integer
        public_id:
          type: string
        is_platform:
          type: boolean
        source_plan_id:
          type: integer
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        level:
          $ref: '#/components/schemas/PlanLevel'
        is_published:
          type: boolean
        is_active:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutPlanItem'
    StoreLibraryPlanRequest:
      type: object
      required: [title, level]
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 1000
        level:
          $ref: '#/components/schemas/PlanLevel'
        is_published:
          type: boolean
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PlanItemInput'
    UpdateLibraryPlanRequest:
      allOf:
        - $ref: '#/components/schemas/StoreLibraryPlanRequest'
        - type: object
          properties:
            is_active:
              type: boolean
    SaveClientPlanRequest:
      type: object
      required: [title, level]
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 1000
        level:
          $ref: '#/components/schemas/PlanLevel'
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PlanItemInput'
    CopyLibraryPlanRequest:
      type: object
      properties:
        title:
          type: string
          nullable: true
          maxLength: 100
    EmptyDataResponse:
      type: object
      required: [data]
      properties:
        data:
          nullable: true
    WorkoutPlanListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutPlan'
    WorkoutPlanItemResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/WorkoutPlan'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Нарушение доменного ограничения
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Ошибка валидации запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

