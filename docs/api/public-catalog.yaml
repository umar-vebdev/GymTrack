openapi: 3.0.3
info:
  title: GymTrack — публичный каталог залов
  version: 1.0.0
paths:
  /api/v1/public/gyms:
    get:
      summary: Поиск и фильтрация опубликованных залов в публичном каталоге
      description: |
        Доступно без авторизации. Возвращает только одобренные модерацией (`approved`)
        и явно опубликованные владельцем (`is_public = true`) витрины залов.
        Сортировка по публичному идентификатору (`id` — ULID).
        При указании `price_min` или `price_max` параметр `currency` обязателен.
      parameters:
        - in: query
          name: q
          required: false
          description: Поиск по подстроке названия зала без учёта регистра
          schema:
            type: string
            maxLength: 100
        - in: query
          name: district
          required: false
          description: Точное совпадение района без учёта регистра
          schema:
            type: string
            maxLength: 100
        - in: query
          name: amenities
          required: false
          description: Все указанные удобства должны присутствовать у зала
          style: form
          explode: true
          schema:
            type: array
            maxItems: 30
            items:
              type: string
              maxLength: 50
        - in: query
          name: price_min
          required: false
          description: Минимальная цена активного абонемента в минимальных единицах (включительно)
          schema:
            type: integer
            minimum: 0
        - in: query
          name: price_max
          required: false
          description: Максимальная цена активного абонемента в минимальных единицах (включительно, не меньше price_min)
          schema:
            type: integer
            minimum: 0
        - in: query
          name: currency
          required: false
          description: Трёхбуквенный код валюты (обязателен при указании price_min или price_max)
          schema:
            type: string
            minLength: 3
            maxLength: 3
            example: TJS
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: lat
          required: false
          description: Широта центра поиска по радиусу. Передаётся вместе с lng и radius_km. Залы без координат не возвращаются.
          schema: {type: number, minimum: -90, maximum: 90, example: 38.5598}
        - in: query
          name: lng
          required: false
          description: Долгота центра поиска по радиусу (вместе с lat и radius_km)
          schema: {type: number, minimum: -180, maximum: 180, example: 68.787}
        - in: query
          name: radius_km
          required: false
          description: Радиус поиска в километрах, (0, 100] (вместе с lat и lng)
          schema: {type: number, exclusiveMinimum: true, minimum: 0, maximum: 100, example: 5}
        - in: query
          name: sw_lat
          required: false
          description: Юго-западный угол области карты, широта. sw_lat, sw_lng, ne_lat, ne_lng передаются все вместе; sw_lat <= ne_lat. Границы включаются.
          schema: {type: number, minimum: -90, maximum: 90}
        - in: query
          name: sw_lng
          required: false
          description: Юго-западный угол области карты, долгота (sw_lng <= ne_lng; пересечение 180-го меридиана не поддерживается)
          schema: {type: number, minimum: -180, maximum: 180}
        - in: query
          name: ne_lat
          required: false
          description: Северо-восточный угол области карты, широта
          schema: {type: number, minimum: -90, maximum: 90}
        - in: query
          name: ne_lng
          required: false
          description: Северо-восточный угол области карты, долгота
          schema: {type: number, minimum: -180, maximum: 180}
      responses:
        '200':
          description: Постраничный список публичных витрин залов
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicGym'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          description: VALIDATION_FAILED — некорректные параметры поиска, цены или пагинации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/v1/public/gyms/{publicId}:
    get:
      summary: Публичная карточка зала по ULID с активными типами абонементов
      description: |
        Доступно без авторизации. Возвращает полную витрину одобренного и опубликованного зала
        (`approved` + `is_public = true`) вместе со списком активных типов абонементов компании
        с актуальными ценами и правилами (отсортированных по публичному `id` ULID).
        Если зал не найден, не одобрен или публикация отключена — возвращается 404.
      parameters:
        - in: path
          name: publicId
          required: true
          description: Публичный идентификатор зала (ULID)
          schema:
            type: string
            example: 01JCXYZ0000000000000000000
      responses:
        '200':
          description: Публичная карточка зала
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicGymCard'
        '404':
          description: NOT_FOUND — зал не найден или скрыт из каталога
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
components:
  schemas:
    PublicGym:
      type: object
      required:
        - id
        - name
        - description
        - address
        - district
        - latitude
        - longitude
        - phone
        - working_hours
        - amenities
        - photos
      properties:
        id:
          type: string
          description: Публичный идентификатор зала (ULID)
          example: 01JCXYZ0000000000000000000
        name:
          type: string
          example: Олимп Фитнес
        description:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
          example: Сино
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        phone:
          type: string
          nullable: true
        working_hours:
          type: object
          additionalProperties: true
        amenities:
          type: array
          items:
            type: string
        photos:
          type: array
          items:
            type: string
            format: uri
    PublicGymCard:
      allOf:
        - $ref: '#/components/schemas/PublicGym'
        - type: object
          required:
            - membership_types
          properties:
            membership_types:
              type: array
              items:
                $ref: '#/components/schemas/PublicMembershipType'
    PublicMembershipType:
      type: object
      required:
        - id
        - name
        - kind
        - start_mode
        - price_minor
        - currency
        - visits_count
        - duration_days
        - validity_days
        - daily_limit
        - time_from_minute
        - time_to_minute
        - freeze_max_days
        - freeze_max_times
      properties:
        id:
          type: string
          description: Публичный идентификатор типа абонемента (ULID)
          example: 01JCXYZ1111111111111111111
        name:
          type: string
          example: 12 занятий
        kind:
          type: string
          enum: [visits, duration, unlimited, single]
        start_mode:
          type: string
          enum: [on_sale, first_visit]
        price_minor:
          type: integer
          minimum: 0
          example: 25000
        currency:
          type: string
          example: TJS
        visits_count:
          type: integer
          nullable: true
        duration_days:
          type: integer
          nullable: true
        validity_days:
          type: integer
          nullable: true
        daily_limit:
          type: integer
          example: 1
        time_from_minute:
          type: integer
          nullable: true
        time_to_minute:
          type: integer
          nullable: true
        freeze_max_days:
          type: integer
          example: 0
        freeze_max_times:
          type: integer
          example: 0
    PaginationMeta:
      type: object
      required: [page, per_page, total]
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 1
    ValidationErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              example: VALIDATION_FAILED
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    NotFoundErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
