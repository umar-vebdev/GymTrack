openapi: 3.0.3
info:
  title: GymTrack — аутентификация, OTP и профиль клиента
  version: 1.0.0
  description: |
    Публичные и защищённые эндпоинты регистрации, входа по Sanctum-токену,
    подтверждения телефона по OTP, профиля клиента и проверки состояния сервиса.
    Для локализации сообщений об ошибках передавайте заголовок `Accept-Language: ru | tg`.
paths:
  /api/v1/health:
    get:
      summary: Проверка состояния приложения, БД и Redis
      responses:
        '200':
          description: Все зависимости доступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Одна из зависимостей (БД или Redis) недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/v1/auth/register:
    post:
      summary: Регистрация пользователя (владелец/сотрудник или базовый аккаунт)
      description: Ограничение частоты запросов — `auth-register` (10 запросов/мин с IP).
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserPayload'
      responses:
        '201':
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [id, message]
                    properties:
                      id:
                        type: integer
                      message:
                        type: string
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/login:
    post:
      summary: Вход по телефону и паролю (выдача Sanctum Bearer-токена)
      description: Ограничение частоты — `auth-login` (5/мин по телефону и IP, 20/мин с IP).
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserPayload'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [token]
                    properties:
                      token:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/send-otp:
    post:
      summary: Отправка одноразового SMS-кода для подтверждения телефона
      description: Ограничение частоты — `auth-otp-send` (3/мин на номер телефона, 10/мин с IP).
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpPayload'
      responses:
        '200':
          description: Код отправлен
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/verify-phone:
    post:
      summary: Подтверждение номера телефона одноразовым 6-значным кодом
      description: Ограничение частоты — `auth-otp-verify` (5/мин по телефону и IP, 15/мин с IP).
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPhonePayload'
      responses:
        '200':
          description: Телефон подтверждён
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '400':
          description: Неверный или просроченный OTP-код
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/user:
    get:
      summary: Текущий авторизованный пользователь (Sanctum)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Модель текущего пользователя
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                    nullable: true
                  email:
                    type: string
                    nullable: true
                  phone:
                    type: string
                    nullable: true
                  is_phone_verified:
                    type: boolean
                  is_platform_admin:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/client/auth/register:
    post:
      summary: Регистрация клиента мобильного приложения (18+ и согласие на ПДн)
      description: Ограничение частоты — `auth-register` (10 запросов/мин с IP).
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientPayload'
      responses:
        '201':
          description: Клиентский аккаунт создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RegisteredClient'
        '409':
          description: Телефон уже зарегистрирован (`PHONE_ALREADY_REGISTERED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Возраст менее 18 лет (`UNDERAGE_REGISTRATION_NOT_ALLOWED`), нет согласия (`PERSONAL_DATA_CONSENT_REQUIRED`) или ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/client/profile:
    get:
      summary: Получение профиля текущего клиента
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Данные профиля клиента
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ClientProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Обезличивание и удаление аккаунта клиента по запросу ПДн
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Аккаунт удалён и обезличен
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [deleted]
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum: [ru, tg]
        default: ru
      description: Язык локализованных сообщений (`ru` или `tg`, по умолчанию `ru`).
  responses:
    Unauthorized:
      description: Необходима авторизация или неверные учётные данные
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Ошибка валидации входных данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          schema:
            type: integer
          description: Количество секунд до сброса лимита
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthStatus:
      type: object
      required: [app, database, redis]
      properties:
        app:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok, error]
        redis:
          type: string
          enum: [ok, error]
    RegisterUserPayload:
      type: object
      required: [password]
      properties:
        phone:
          type: string
          maxLength: 20
          nullable: true
          description: Обязателен, если не передан `email`.
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
          description: Обязателен, если не передан `phone`.
        password:
          type: string
          minLength: 8
    LoginUserPayload:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          maxLength: 20
        password:
          type: string
        device:
          type: string
          maxLength: 255
          nullable: true
          default: mobile
    SendOtpPayload:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          maxLength: 20
    VerifyPhonePayload:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          maxLength: 20
        code:
          type: string
          minLength: 6
          maxLength: 6
    RegisterClientPayload:
      type: object
      required: [phone, name, password, birth_date, consent]
      properties:
        phone:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
        password:
          type: string
          minLength: 8
        birth_date:
          type: string
          format: date
          example: '1995-06-01'
        consent:
          type: boolean
    RegisteredClient:
      type: object
      required: [id, phone, name, birth_date, is_phone_verified]
      properties:
        id:
          type: integer
        phone:
          type: string
        name:
          type: string
        birth_date:
          type: string
          format: date
        is_phone_verified:
          type: boolean
    ClientProfile:
      type: object
      required: [id, is_phone_verified]
      properties:
        id:
          type: integer
        phone:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        is_phone_verified:
          type: boolean
        personal_data_consented_at:
          type: string
          format: date-time
          nullable: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
